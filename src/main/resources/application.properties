spring.application.name=spring-ai-chat-api
spring.config.import=optional:file:.env[.properties]
server.port=8081

# ─── Database ────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spring-ai-chat-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ─── JPA ─────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Gemini (Google GenAI) ───────────────────────────────────────────────────
# Set GEMINI_API_KEY in your .env file or as an OS environment variable
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite

# ─── JWT ─────────────────────────────────────────────────────────────────────
# Must be at least 32 characters. Set via environment variable in production.
jwt.secret=${JWT_SECRET:replace-with-very-long-secret-key-at-least-32-characters}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}